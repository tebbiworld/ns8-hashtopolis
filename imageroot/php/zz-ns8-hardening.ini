; Mounted by the module into the backend at
; /usr/local/etc/php/conf.d/zz-ns8-hardening.ini (read after the image's own
; custom.ini).
;
; CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp, RCE via stale global state). The
; advisory names these two settings as the configuration mitigation for the
; demonstrated cases. They do not replace a fixed PHP release (8.5.12 or later),
; but they stay useful afterwards: Hashtopolis uses neither feature.
;
; - the session upload progress feature produced and consumed the stale state
;   in the session lifecycle case
session.upload_progress.enabled = 0
; - PHP 8.5: fatal error backtraces were the producer of the confirmed RCE case
fatal_error_backtraces = 0
