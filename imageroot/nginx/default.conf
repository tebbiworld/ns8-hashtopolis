#
# Single entry point for the Hashtopolis module.
#
# This file replaces the frontend image's own /etc/nginx/conf.d/default.conf.
# It keeps the upstream behaviour for the Angular single page application and
# additionally reverse-proxies every path that the PHP backend has to serve, so
# the module needs exactly one published port and one Traefik route. Splitting
# the paths is an internal matter of this module and must not leak into the
# cluster reverse proxy.
#
# Backend paths (verified against docker.io/hashtopolis/backend):
#   /api/          v1 API (api/server.php, user.php, taskimg.php) and v2 REST
#                  API (api/v2, Slim + mod_rewrite)
#   /static/       7zr and uftpd agent binaries (DownloadBinaryAction) plus the
#                  assets of the legacy PHP UI
#   /binaries/     Apache alias for manually provided cracker archives
#   /agents.php    agent self-update download
#   /getFile.php, /getFound.php, /getHashlist.php
#                  agent downloads; the agent resolves them relative to its own
#                  URL, so they must live on the same host name
#
# Everything else is the Angular application.
#

# Preserve the scheme the client used. Traefik terminates TLS and announces the
# original scheme in X-Forwarded-Proto; fall back to our own scheme when the
# header is absent (direct access without a reverse proxy).
map $http_x_forwarded_proto $ht_forwarded_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ----------------------------
  # Security header (global)
  # ----------------------------
  server_tokens off;

  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "geolocation=(), midi=(), notifications=(), push=(), sync-xhr=(self), microphone=(), camera=(), magnetometer=(), gyroscope=(), speaker=(), vibrate=(), fullscreen=(self), payment=(), bluetooth=(), display-capture=(), usb=()" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;

  # ----------------------------
  # GZip compression
  # ----------------------------
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_disable "msie6";

  gzip_types
      text/plain
      text/css
      text/xml
      application/json
      application/javascript
      application/xml
      application/xml+rss
      application/vnd.ms-fontobject
      application/x-font-ttf
      font/woff
      font/woff2
      image/svg+xml;

  # ----------------------------
  # Proxy defaults, inherited by the backend locations below
  # ----------------------------
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $ht_forwarded_proto;
  # Hashlists, wordlists and cracker archives can be large, and the backend
  # streams downloads: do not buffer or cap the body size here.
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_connect_timeout 30s;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;

  # ----------------------------
  # Backend (Apache in the same pod, on 127.0.0.1:80)
  # ----------------------------
  location ^~ /api/ {
      proxy_pass http://127.0.0.1:80;
  }

  location ^~ /static/ {
      proxy_pass http://127.0.0.1:80;
  }

  location ^~ /binaries/ {
      proxy_pass http://127.0.0.1:80;
  }

  location = /agents.php {
      proxy_pass http://127.0.0.1:80;
  }

  location = /getFile.php {
      proxy_pass http://127.0.0.1:80;
  }

  location = /getFound.php {
      proxy_pass http://127.0.0.1:80;
  }

  location = /getHashlist.php {
      proxy_pass http://127.0.0.1:80;
  }

  # ----------------------------
  # Angular routing
  # ----------------------------
  location / {
      try_files $uri $uri/ /index.html;
  }

  # ----------------------------
  #  index.html: no caching
  # ----------------------------
  location = /index.html {
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # ----------------------------
  # custom themes: disable caching
  # ----------------------------
  location = /assets/themes/custom-themes.json {
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location ^~ /assets/custom-themes/ {
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # ----------------------------
  # optional JSON / config short caching
  # ----------------------------
  location ~* \.json$ {
      expires 1h;
      add_header Cache-Control "public" always;
  }

  # ----------------------------
  # static assets: long caching period
  # ----------------------------
  location ~* \.(?:js|css|woff2?|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      access_log off;
  }

  # ----------------------------
  # static assets: short caching period
  # ----------------------------
  location ~* \.(?:ico|png|jpg|jpeg|gif|svg)$ {
      expires 7d;
      add_header Cache-Control "public, immutable" always;
      access_log off;
  }
}
