# Paths included in the module backup (state/environment is always included).
#   state/passwords.env   generated secrets
#   state/hashtopolis.sql MySQL dump written by module-dump-state
#   hashtopolis-data      uploaded files, hashlists, agent binaries
# The live MySQL data directory (hashtopolis-db) is NOT copied: restore-module
# rebuilds it from the dump.
state/passwords.env
state/hashtopolis.sql
volumes/hashtopolis-data
